<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Mansion - Seismic Chads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-gold {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-pulse-gold {
            animation: pulse-gold 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.8s ease-out forwards;
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden" style="background: linear-gradient(135deg, rgba(251, 239, 210, 0.9) 0%, rgba(245, 230, 195, 0.9) 25%, rgba(240, 220, 180, 0.9) 50%, rgba(235, 210, 165, 0.9) 75%, rgba(230, 200, 150, 0.9) 100%), url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23D4AF37\' fill-opacity=\'0.1\'%3E%3Cpath d=\'M30 30c0-11.046-8.954-20-20-20s-20 8.954-20 20 8.954 20 20 20 20-8.954 20-20zm0 0c0 11.046 8.954 20 20 20s20-8.954 20-20-8.954-20-20-20-20 8.954-20 20z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');">

    <!-- Floating background elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-20 opacity-20 animate-float">
            <svg width="100" height="100" viewBox="0 0 120 120" class="text-amber-800" style="filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3))">
                <path d="M20 25 Q60 10, 100 25" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M25 35 Q60 25, 95 35" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M30 50 Q35 40, 45 50 Q55 60, 65 50 Q75 40, 85 50 Q90 60, 85 70" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M85 50 Q90 40, 85 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M35 50 Q30 40, 35 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M20 85 Q60 95, 100 85" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M25 75 Q60 85, 95 75" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="absolute top-40 right-32 opacity-15 animate-pulse-gold">
            <svg width="80" height="80" viewBox="0 0 120 120" class="text-amber-800">
                <path d="M20 25 Q60 10, 100 25" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M25 35 Q60 25, 95 35" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M30 50 Q35 40, 45 50 Q55 60, 65 50 Q75 40, 85 50 Q90 60, 85 70" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M85 50 Q90 40, 85 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M35 50 Q30 40, 35 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M20 85 Q60 95, 100 85" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M25 75 Q60 85, 95 75" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="absolute bottom-32 left-40 opacity-10 animate-float" style="animation-delay: 2s;">
            <svg width="120" height="120" viewBox="0 0 120 120" class="text-amber-800">
                <path d="M20 25 Q60 10, 100 25" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M25 35 Q60 25, 95 35" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M30 50 Q35 40, 45 50 Q55 60, 65 50 Q75 40, 85 50 Q90 60, 85 70" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M85 50 Q90 40, 85 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M35 50 Q30 40, 35 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M20 85 Q60 95, 100 85" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M25 75 Q60 85, 95 75" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8 relative z-10 max-w-7xl">
        <!-- Header -->
        <div class="text-center mb-12 animate-slide-in">
            <div class="flex items-center justify-center gap-4 mb-4 flex-wrap">
                <div class="animate-pulse-gold">
                    <svg width="80" height="80" viewBox="0 0 120 120" class="text-amber-800" style="filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3))">
                        <path d="M20 25 Q60 10, 100 25" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M25 35 Q60 25, 95 35" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                        <path d="M30 50 Q35 40, 45 50 Q55 60, 65 50 Q75 40, 85 50 Q90 60, 85 70" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M85 50 Q90 40, 85 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M35 50 Q30 40, 35 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M20 85 Q60 95, 100 85" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M25 75 Q60 85, 95 75" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-5xl font-bold text-amber-900 mb-2 tracking-wide">
                        Community Mansion
                    </h1>
                    <p class="text-xl text-amber-700 font-medium">
                        Where Seismic Chads gather and flourish
                    </p>
                </div>
                <div class="animate-pulse-gold">
                    <svg width="80" height="80" viewBox="0 0 120 120" class="text-amber-800" style="filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3))">
                        <path d="M20 25 Q60 10, 100 25" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M25 35 Q60 25, 95 35" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                        <path d="M30 50 Q35 40, 45 50 Q55 60, 65 50 Q75 40, 85 50 Q90 60, 85 70" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M85 50 Q90 40, 85 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M35 50 Q30 40, 35 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M20 85 Q60 95, 100 85" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M25 75 Q60 85, 95 75" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
            <div class="w-32 h-1 bg-gradient-to-r from-amber-600 to-amber-800 mx-auto rounded-full"></div>
        </div>

        <div class="grid lg:grid-cols-2 gap-8">
            <!-- Twitter Search & Members Section -->
            <div class="glass-effect rounded-2xl shadow-2xl p-8 animate-slide-in" style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation-delay: 0.2s;">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-3xl font-bold text-amber-900 flex items-center gap-3">
                        <svg class="w-8 h-8 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                        Discover Members
                    </h2>
                    <button onclick="showAddMemberForm()" class="bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-700 hover:to-amber-800 text-white px-6 py-3 rounded-xl flex items-center gap-3 transition-all duration-300 transform hover:scale-105 shadow-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                        Invite Member
                    </button>
                </div>

                <!-- Twitter Search Bar -->
                <div class="relative mb-8">
                    <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 text-amber-600 w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search Twitter for distinguished members..."
                        class="w-full pl-14 pr-32 py-4 border-2 border-amber-200 rounded-xl focus:ring-4 focus:ring-amber-300 focus:border-amber-400 transition-all duration-300 bg-white/80 text-lg"
                        onkeypress="if(event.key==='Enter') searchTwitter()"
                    />
                    <div class="absolute right-3 top-1/2 transform -translate-y-1/2 flex gap-2">
                        <svg class="w-6 h-6 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
                        </svg>
                        <button
                            onclick="searchTwitter()"
                            id="searchBtn"
                            class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg transition-all duration-300"
                        >
                            Search
                        </button>
                    </div>
                </div>

                <!-- Add Member Form (Hidden by default) -->
                <div id="addMemberForm" class="bg-gradient-to-br from-amber-50 to-orange-50 p-6 rounded-xl mb-8 border border-amber-200 hidden">
                    <h3 class="font-bold text-amber-900 mb-4 flex items-center gap-3 text-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                        </svg>
                        Extend Personal Invitation
                    </h3>
                    <div class="space-y-4">
                        <input
                            type="text"
                            id="memberName"
                            placeholder="Distinguished Name"
                            class="w-full px-4 py-3 border-2 border-amber-200 rounded-lg focus:ring-4 focus:ring-amber-300 focus:border-amber-400 transition-all duration-300"
                        />
                        <input
                            type="email"
                            id="memberEmail"
                            placeholder="Private Correspondence"
                            class="w-full px-4 py-3 border-2 border-amber-200 rounded-lg focus:ring-4 focus:ring-amber-300 focus:border-amber-400 transition-all duration-300"
                        />
                        <select
                            id="memberRole"
                            class="w-full px-4 py-3 border-2 border-amber-200 rounded-lg focus:ring-4 focus:ring-amber-300 focus:border-amber-400 transition-all duration-300"
                        >
                            <option value="resident">Resident</option>
                            <option value="moderator">Moderator</option>
                            <option value="founder">Founder</option>
                        </select>
                        <div class="flex gap-3">
                            <button
                                onclick="addManualMember()"
                                class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-6 py-3 rounded-lg transition-all duration-300 transform hover:scale-105"
                            >
                                Send Invitation
                            </button>
                            <button
                                onclick="hideAddMemberForm()"
                                class="bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700 text-white px-6 py-3 rounded-lg transition-all duration-300"
                            >
                                Cancel
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Members List -->
                <div id="membersList" class="space-y-4 max-h-96 overflow-y-auto pr-2">
                    <!-- Demo members will be populated here -->
                </div>
            </div>

            <!-- Mansion Residents Section -->
            <div class="glass-effect rounded-2xl shadow-2xl p-8 animate-slide-in" style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation-delay: 0.4s;">
                <h2 class="text-3xl font-bold text-amber-900 mb-8 flex items-center gap-3">
                    <svg class="w-8 h-8 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m0 0v-5a1 1 0 011-1h2a1 1 0 011 1v5m3 0a1 1 0 001-1V10M9 21h6"></path>
                    </svg>
                    Mansion Residents (<span id="residentCount">0</span>)
                </h2>

                <div id="mansionList" class="space-y-4 max-h-96 overflow-y-auto pr-2">
                    <!-- Mansion residents will be populated here -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-12 text-amber-700 animate-slide-in" style="animation-delay: 0.6s;">
            <div class="flex items-center justify-center gap-4 mb-4">
                <div class="w-24 h-0.5 bg-amber-600"></div>
                <svg width="40" height="40" viewBox="0 0 120 120" class="text-amber-800">
                    <path d="M20 25 Q60 10, 100 25" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M25 35 Q60 25, 95 35" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                    <path d="M30 50 Q35 40, 45 50 Q55 60, 65 50 Q75 40, 85 50 Q90 60, 85 70" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M85 50 Q90 40, 85 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M35 50 Q30 40, 35 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M20 85 Q60 95, 100 85" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M25 75 Q60 85, 95 75" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                </svg>
                <div class="w-24 h-0.5 bg-amber-600"></div>
            </div>
            <p class="text-lg font-medium">Community Mansion - Where Seismic Chads Reside</p>
            <p class="text-sm mt-2 opacity-75">
                🔗 Connected to VPS Backend | 🐦 Twitter API Integration Ready
            </p>
        </div>
    </div>

    <script>
        // Configuration - CHANGE THESE TO YOUR ACTUAL VALUES
        const API_BASE = 'https://your-vps-domain.com/api'; // Change to your VPS domain
        const TWITTER_API_ENDPOINT = '/twitter-search'; // Your backend Twitter search endpoint
        
        // Global state
        let members = [];
        let mansion = [];

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            loadDemoData();
            loadFromBackend();
        });

        // Load demo data for testing
        function loadDemoData() {
            members = [
                { id: 1, name: 'Alexandra Sterling', username: 'alex_seismic', email: 'alex@mansion.com', role: 'founder', source: 'manual' },
                { id: 2, name: 'Marcus Thompson', username: 'marcus_geo', email: 'marcus@mansion.com', role: 'moderator', source: 'twitter' },
                { id: 3, name: 'Sofia Rodriguez', username: 'sofia_quake', email: 'sofia@mansion.com', role: 'resident', source: 'manual' },
                { id: 4, name: 'James Chen', username: 'james_seismo', email: 'james@mansion.com', role: 'resident', source: 'twitter' }
            ];

            mansion = [
                { id: 1, name: 'Alexandra Sterling', role: 'founder', joinedAt: '2025-01-15', room: 'penthouse', source: 'manual' },
                { id: 2, name: 'Marcus Thompson', role: 'moderator', joinedAt: '2025-02-01', room: 'library', source: 'twitter' },
                { id: 3, name: 'Sofia Rodriguez', role: 'resident', joinedAt: '2025-02-15', room: 'garden', source: 'manual' }
            ];

            renderMembers();
            renderMansion();
        }

        // Load data from backend
        async function loadFromBackend() {
            try {
                // Try to load from your VPS backend
                const [membersResponse, mansionResponse] = await Promise.all([
                    fetch(`${API_BASE}/members`),
                    fetch(`${API_BASE}/mansion`)
                ]);

                if (membersResponse.ok && mansionResponse.ok) {
                    members = await membersResponse.json();
                    mansion = await mansionResponse.json();
                    renderMembers();
                    renderMansion();
                }
            } catch (error) {
                console.log('Backend not available, using demo data');
                // Demo data is already loaded
            }
        }

        // Search Twitter for users
        async function searchTwitter() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const searchBtn = document.getElementById('searchBtn');
            searchBtn.textContent = 'Searching...';
            searchBtn.disabled = true;

            try {
                // Try to search via your backend
                const response = await fetch(`${API_BASE}${TWITTER_API_ENDPOINT}?q=${encodeURIComponent(query)}`);
                
                if (response.ok) {
                    const twitterUsers = await response.json();
                    
                    // Add Twitter users to members list
                    twitterUsers.forEach(user => {
                        if (!members.some(m => m.username === user.username)) {
                            members.push({
                                id: Date.now() + Math.random(),
                                name: user.name,
                                username: user.username,
                                email: `${user.username}@twitter.com`,
                                role: 'guest',
                                source: 'twitter',
                                followers: user.public_metrics?.followers_count || 0,
                                verified: user.verified || false
                            });
                        }
                    });
                } else {
                    throw new Error('Backend search failed');
                }
            } catch (error) {
                console.error('Twitter search error:', error);
                
                // Demo Twitter search results
                const demoTwitterResults = [
                    {
                        id: Date.now(),
                        name: `${query} Chad`,
                        username: `${query.toLowerCase().replace(' ', '_')}_seismic`,
                        email: `${query.toLowerCase().replace(' ', '.')}@twitter.com`,
                        role: 'guest',
                        source: 'twitter',
                        followers: Math.floor(Math.random() * 10000),
                        verified: Math.random() > 0.7
                    }
                ];
                
                demoTwitterResults.forEach(user => {
                    if (!members.some(m => m.username === user.username)) {
                        members.push(user);
                    }
                });
            }

            renderMembers();
            searchBtn.textContent = 'Search';
            searchBtn.disabled = false;
            document.getElementById('searchInput').value = '';
        }

        // Add manual member
        async function addManualMember() {
            const name = document.getElementById('memberName').value.trim();
            const email = document.getElementById('memberEmail').value.trim();
            const role = document.getElementById('memberRole').value;

            if (!name || !email) {
                alert('Please fill in all fields');
                return;
            }

            const newMember = {
                id: Date.now(),
                name,
                email,
                role,
                source: 'manual'
            };

            try {
                // Try to save to backend
                const response = await fetch(`${API_BASE}/members`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newMember)
                });

                if (response.ok) {
                    const savedMember = await response.json();
                    members.push(savedMember);
                } else {
                    throw new Error('Backend save failed');
                }
            } catch (error) {
                console.error('Error saving member:', error);
                // Add locally for demo
                members.push(newMember);
            }

            renderMembers();
            hideAddMemberForm();
            
            // Clear form
            document.getElementById('memberName').value = '';
            document.getElementById('memberEmail').value = '';
            document.getElementById('memberRole').value = 'resident';
        }

        // Add member to mansion
        async function addToMansion(member) {
            const rooms = ['penthouse', 'library', 'garden', 'workshop', 'lounge', 'study', 'observatory', 'wine_cellar'];
            const randomRoom = rooms[Math.floor(Math.random() * rooms.length)];

            const mansionEntry = {
                id: Date.now(),
                name: member.name,
                role: member.role,
                room: randomRoom,
                source: member.source,
                joinedAt: new Date().toISOString().split('T')[0],
                memberId: member.id
            };

            try {
                // Try to save to backend
                const response = await fetch(`${API_BASE}/mansion`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(mansionEntry)
                });

                if (response.ok) {
                    const savedEntry = await response.json();
                    mansion.push(savedEntry);
                } else {
                    throw new Error('Backend save failed');
                }
            } catch (error) {
                console.error('Error adding to mansion:', error);
                // Add locally for demo
                mansion.push(mansionEntry);
            }

            renderMansion();
        }

        // Remove from mansion
        async function removeFromMansion(mansionId) {
            try {
                // Try to remove from backend
                const response = await fetch(`${API_BASE}/mansion/${mansionId}`, {
                    method: 'DELETE'
                });

                if (response.ok || response.status === 404) {
                    mansion = mansion.filter(item => item.id !== mansionId);
                } else {
                    throw new Error('Backend delete failed');
                }
            } catch (error) {
                console.error('Error removing from mansion:', error);
                // Remove locally for demo
                mansion = mansion.filter(item => item.id !== mansionId);
            }

            renderMansion();
        }

        // Show/hide forms
        function showAddMemberForm() {
            document.getElementById('addMemberForm').classList.remove('hidden');
        }

        function hideAddMemberForm() {
            document.getElementById('addMemberForm').classList.add('hidden');
        }

        // Get role icon
        function getRoleIcon(role) {
            switch(role) {
                case 'founder': return '👑';
                case 'moderator': return '⭐';
                case 'resident': return '🏠';
                case 'guest': return '👤';
                default: return '👤';
            }
        }

        // Get role color
        function getRoleColor(role) {
            switch(role) {
                case 'founder': return 'bg-yellow-100 text-yellow-800 border-yellow-200';
                case 'moderator': return 'bg-blue-100 text-blue-800 border-blue-200';
                case 'resident': return 'bg-green-100 text-green-800 border-green-200';
                case 'guest': return 'bg-gray-100 text-gray-800 border-gray-200';
                default: return 'bg-gray-100 text-gray-800 border-gray-200';
            }
        }

        // Get source badge
        function getSourceBadge(source) {
            switch(source) {
                case 'twitter': return '<span class="inline-flex items-center gap-1 px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>Twitter</span>';
                case 'manual': return '<span class="inline-flex items-center gap-1 px-2 py-1 bg-amber-100 text-amber-800 text-xs rounded-full">✋ Manual</span>';
                default: return '<span class="inline-flex items-center gap-1 px-2 py-1 bg-gray-100 text-gray-800 text-xs rounded-full">🔍 Search</span>';
            }
        }

        // Render members list
        function renderMembers() {
            const container = document.getElementById('membersList');
            
            if (members.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-amber-600">
                        <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                        <p class="text-xl">No members found. Begin your search or extend an invitation.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = members.map(member => {
                const isInMansion = mansion.some(m => m.name === member.name);
                const verifiedBadge = member.verified ? '<span class="text-blue-500" title="Verified">✓</span>' : '';
                const followerCount = member.followers ? `<span class="text-xs text-gray-500">${member.followers.toLocaleString()} followers</span>` : '';
                
                return `
                    <div class="flex items-center justify-between p-6 bg-gradient-to-r from-white/60 to-amber-50/60 rounded-xl hover:from-amber-50 hover:to-orange-50 transition-all duration-300 border border-amber-100 backdrop-blur-sm">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-gradient-to-br from-amber-400 to-amber-600 rounded-full flex items-center justify-center text-white font-bold text-lg">
                                ${member.name.charAt(0)}
                            </div>
                            <div>
                                <h3 class="font-bold text-amber-900 text-lg flex items-center gap-2">
                                    ${member.name} ${verifiedBadge}
                                </h3>
                                ${member.username ? `<p class="text-amber-600">@${member.username}</p>` : ''}
                                <p class="text-amber-700 text-sm">${member.email}</p>
                                ${followerCount}
                                <div class="flex items-center gap-2 mt-2">
                                    <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-sm border ${getRoleColor(member.role)}">
                                        ${getRoleIcon(member.role)} ${member.role.charAt(0).toUpperCase() + member.role.slice(1)}
                                    </span>
                                    ${getSourceBadge(member.source)}
                                </div>
                            </div>
                        </div>
                        <button
                            onclick="addToMansion(${JSON.stringify(member).replace(/"/g, '&quot;')})"
                            ${isInMansion ? 'disabled' : ''}
                            class="bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-700 hover:to-amber-800 disabled:from-gray-400 disabled:to-gray-500 text-white px-4 py-2 rounded-lg transition-all duration-300 transform hover:scale-105 disabled:scale-100"
                        >
                            ${isInMansion ? 'In Mansion' : 'Invite to Mansion'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Render mansion residents
        function renderMansion() {
            const container = document.getElementById('mansionList');
            const countElement = document.getElementById('residentCount');
            
            countElement.textContent = mansion.length;

            if (mansion.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-amber-600">
                        <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m0 0v-5a1 1 0 011-1h2a1 1 0 011 1v5m3 0a1 1 0 001-1V10M9 21h6"></path>
                        </svg>
                        <p class="text-xl">The mansion awaits its first distinguished residents.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = mansion.map(resident => `
                <div class="p-6 bg-gradient-to-r from-green-50 to-emerald-50 rounded-xl border border-green-200 backdrop-blur-sm">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-gradient-to-br from-green-400 to-emerald-600 rounded-full flex items-center justify-center text-white font-bold text-xl">
                                ${resident.name.charAt(0)}
                            </div>
                            <div>
                                <h3 class="font-bold text-green-900 text-lg">${resident.name}</h3>
                                <div class="flex items-center gap-2 text-green-700 mb-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    </svg>
                                    <span class="capitalize">${resident.room.replace('_', ' ')} Suite</span>
                                </div>
                                <p class="text-sm text-green-600">
                                    Joined: ${new Date(resident.joinedAt).toLocaleDateString()}
                                </p>
                                <div class="flex items-center gap-2 mt-2">
                                    <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-sm border ${getRoleColor(resident.role)}">
                                        ${getRoleIcon(resident.role)} ${resident.role.charAt(0).toUpperCase() + resident.role.slice(1)}
                                    </span>
                                    ${getSourceBadge(resident.source)}
                                </div>
                            </div>
                        </div>
                        <button
                            onclick="removeFromMansion(${resident.id})"
                            class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white p-3 rounded-lg transition-all duration-300 transform hover:scale-105"
                            title="Remove from mansion"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Save to localStorage for persistence (fallback)
        function saveToLocalStorage() {
            try {
                localStorage.setItem('mansion_members', JSON.stringify(members));
                localStorage.setItem('mansion_residents', JSON.stringify(mansion));
            } catch (error) {
                console.log('LocalStorage not available');
            }
        }

        // Load from localStorage
        function loadFromLocalStorage() {
            try {
                const savedMembers = localStorage.getItem('mansion_members');
                const savedMansion = localStorage.getItem('mansion_residents');
                
                if (savedMembers) {
                    members = JSON.parse(savedMembers);
                }
                if (savedMansion) {
                    mansion = JSON.parse(savedMansion);
                }
            } catch (error) {
                console.log('Error loading from localStorage');
            }
        }

        // Auto-save every 30 seconds
        setInterval(saveToLocalStorage, 30000);

        // Save before page unload
        window.addEventListener('beforeunload', saveToLocalStorage);
    </script>
</body>
</html>
