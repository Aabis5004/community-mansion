<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Mansion - Seismic Chads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460, #533483);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card {
            transition: all 0.3s ease;
            animation: float 6s ease-in-out infinite;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.3);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .card:nth-child(odd) { animation-delay: -2s; }
        .card:nth-child(3n) { animation-delay: -4s; }

        .glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .glow:focus {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }

        .logo-spin {
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .role-founder { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .role-moderator { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .role-resident { background: linear-gradient(135deg, #10b981, #059669); }
        .role-guest { background: linear-gradient(135deg, #6b7280, #4b5563); }

        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp 8s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) translateX(0px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(50px); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen text-white">
    <!-- Particles -->
    <div id="particles" class="fixed inset-0 pointer-events-none z-0"></div>

    <div class="relative z-10 min-h-screen">
        <!-- Header -->
        <header class="glass p-6 mb-8">
            <div class="max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-4">
                    <div class="logo-spin">
                        <svg width="60" height="60" viewBox="0 0 120 120" class="text-blue-400">
                            <path d="M20 25 Q60 10, 100 25" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                            <path d="M25 35 Q60 25, 95 35" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                            <path d="M30 50 Q35 40, 45 50 Q55 60, 65 50 Q75 40, 85 50 Q90 60, 85 70" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                            <path d="M85 50 Q90 40, 85 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                            <path d="M35 50 Q30 40, 35 30" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                            <path d="M20 85 Q60 95, 100 85" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round"/>
                            <path d="M25 75 Q60 85, 95 75" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                            Community Mansion
                        </h1>
                        <p class="text-gray-300">Seismic Chads Network</p>
                    </div>
                </div>
                <div class="flex gap-4">
                    <div class="text-center">
                        <div class="text-sm text-gray-400">Members</div>
                        <div class="text-2xl font-bold text-blue-400" id="memberCount">0</div>
                    </div>
                    <div class="text-center">
                        <div class="text-sm text-gray-400">In Mansion</div>
                        <div class="text-2xl font-bold text-purple-400" id="mansionCount">0</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="max-w-7xl mx-auto px-4">
            <!-- Search Section -->
            <div class="glass p-8 mb-8 rounded-2xl">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    Discover Seismic Chads
                </h2>

                <div class="flex gap-4 mb-6 flex-wrap">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search Twitter for seismic researchers..."
                        class="flex-1 min-w-64 px-6 py-4 bg-black/30 border border-gray-600 rounded-xl text-white placeholder-gray-400 glow focus:outline-none focus:border-blue-400"
                        onkeypress="if(event.key==='Enter') searchTwitter()"
                    />
                    <button
                        onclick="searchTwitter()"
                        class="px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded-xl font-semibold transition-all duration-300 transform hover:scale-105 flex items-center gap-2"
                    >
                        🐦 Search Twitter
                    </button>
                    <button
                        onclick="showAddForm()"
                        class="px-6 py-4 bg-gradient-to-r from-green-600 to-teal-600 hover:from-green-500 hover:to-teal-500 rounded-xl font-semibold transition-all duration-300 transform hover:scale-105"
                    >
                        + Add Manual
                    </button>
                </div>

                <!-- Add Form -->
                <div id="addForm" class="hidden bg-black/30 p-6 rounded-xl border border-gray-600 mb-6">
                    <h3 class="text-lg font-semibold mb-4">Add Member Manually</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input type="text" id="manualName" placeholder="Full Name" class="px-4 py-3 bg-black/50 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-blue-400"/>
                        <input type="text" id="manualUsername" placeholder="Username" class="px-4 py-3 bg-black/50 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-blue-400"/>
                        <select id="manualRole" class="px-4 py-3 bg-black/50 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-400">
                            <option value="resident">Resident</option>
                            <option value="moderator">Moderator</option>
                            <option value="founder">Founder</option>
                        </select>
                    </div>
                    <div class="flex gap-4 mt-4">
                        <button onclick="addManualMember()" class="px-6 py-2 bg-green-600 hover:bg-green-500 rounded-lg transition-colors">Add Member</button>
                        <button onclick="hideAddForm()" class="px-6 py-2 bg-gray-600 hover:bg-gray-500 rounded-lg transition-colors">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- Members Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8" id="membersGrid">
                <!-- Members will be populated here -->
            </div>

            <!-- Mansion Section -->
            <div class="glass p-8 rounded-2xl">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                    <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m0 0v-5a1 1 0 011-1h2a1 1 0 011 1v5m3 0a1 1 0 001-1V10M9 21h6"></path>
                    </svg>
                    Mansion Residents
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="mansionGrid">
                    <!-- Mansion residents will be populated here -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center mt-12 p-8 text-gray-400">
            <p>🏛️ Community Mansion - Where Seismic Chads Reside</p>
        </footer>
    </div>

    <script>
        // Configuration
        const API_BASE = 'https://your-vps-domain.com/api';
        
        // Global state
        let members = [];
        let mansion = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            loadDemoData();
            updateCounts();
        });

        // Create particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 10; i++) {
                setTimeout(() => createParticle(container), i * 1000);
            }
        }

        function createParticle(container) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 8 + 's';
            container.appendChild(particle);

            setTimeout(() => {
                if (container.contains(particle)) {
                    container.removeChild(particle);
                }
                createParticle(container);
            }, 8000);
        }

        // Load demo data
        function loadDemoData() {
            members = [
                {
                    id: 1,
                    name: 'Dr. Sarah Earthquake',
                    username: 'sarah_seismic',
                    role: 'founder',
                    source: 'manual',
                    followers: 15420,
                    verified: true
                },
                {
                    id: 2,
                    name: 'Marcus Tremor',
                    username: 'marcus_geo',
                    role: 'moderator',
                    source: 'twitter',
                    followers: 8930,
                    verified: false
                },
                {
                    id: 3,
                    name: 'Prof. Alex Richter',
                    username: 'alex_richter',
                    role: 'resident',
                    source: 'manual',
                    followers: 5670,
                    verified: true
                }
            ];

            mansion = [
                {
                    id: 1,
                    name: 'Dr. Sarah Earthquake',
                    role: 'founder',
                    room: 'penthouse',
                    source: 'manual',
                    joined_at: '2025-01-15'
                },
                {
                    id: 2,
                    name: 'Marcus Tremor',
                    role: 'moderator',
                    room: 'library',
                    source: 'twitter',
                    joined_at: '2025-02-01'
                }
            ];

            renderMembers();
            renderMansion();
        }

        // Search Twitter
        async function searchTwitter() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            // Demo search result
            const demoResult = {
                id: Date.now(),
                name: `${query} Chad`,
                username: `${query.toLowerCase().replace(/\s+/g, '_')}_seismic`,
                role: 'guest',
                source: 'twitter',
                followers: Math.floor(Math.random() * 10000),
                verified: Math.random() > 0.8
            };
            
            if (!members.some(m => m.username === demoResult.username)) {
                members.push(demoResult);
                renderMembers();
                updateCounts();
            }

            document.getElementById('searchInput').value = '';
        }

        // Add manual member
        function addManualMember() {
            const name = document.getElementById('manualName').value.trim();
            const username = document.getElementById('manualUsername').value.trim();
            const role = document.getElementById('manualRole').value;

            if (!name) {
                alert('Please enter a name');
                return;
            }

            const newMember = {
                id: Date.now(),
                name,
                username: username || name.toLowerCase().replace(/\s+/g, '_'),
                role,
                source: 'manual',
                followers: 0,
                verified: false
            };

            members.push(newMember);
            renderMembers();
            updateCounts();
            hideAddForm();
            
            // Clear form
            document.getElementById('manualName').value = '';
            document.getElementById('manualUsername').value = '';
            document.getElementById('manualRole').value = 'resident';
        }

        // Add to mansion
        function addToMansion(member) {
            if (mansion.some(m => m.name === member.name)) return;

            const rooms = ['penthouse', 'library', 'garden', 'workshop', 'observatory', 'wine_cellar'];
            const randomRoom = rooms[Math.floor(Math.random() * rooms.length)];

            const mansionEntry = {
                id: Date.now(),
                name: member.name,
                role: member.role,
                room: randomRoom,
                source: member.source,
                joined_at: new Date().toISOString().split('T')[0]
            };

            mansion.push(mansionEntry);
            renderMansion();
            updateCounts();
        }

        // Remove from mansion
        function removeFromMansion(mansionId) {
            mansion = mansion.filter(m => m.id !== mansionId);
            renderMansion();
            updateCounts();
        }

        // Show/hide forms
        function showAddForm() {
            document.getElementById('addForm').classList.remove('hidden');
        }

        function hideAddForm() {
            document.getElementById('addForm').classList.add('hidden');
        }

        // Get role icon
        function getRoleIcon(role) {
            const icons = { founder: '👑', moderator: '⭐', resident: '🏠', guest: '👤' };
            return icons[role] || '👤';
        }

        // Render members
        function renderMembers() {
            const container = document.getElementById('membersGrid');
            container.innerHTML = members.map(member => createMemberCard(member)).join('');
        }

        // Render mansion
        function renderMansion() {
            const container = document.getElementById('mansionGrid');
            container.innerHTML = mansion.map(resident => createMansionCard(resident)).join('');
        }

        // Create member card
        function createMemberCard(member) {
            const isInMansion = mansion.some(m => m.name === member.name);
            const roleClass = `role-${member.role}`;
            const verifiedBadge = member.verified ? '<span class="text-blue-400">✓</span>' : '';
            const sourceBadge = member.source === 'twitter' ? '🐦 Twitter' : '✋ Manual';

            return `
                <div class="card glass p-6 rounded-xl">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-16 h-16 rounded-full ${roleClass} flex items-center justify-center text-white font-bold text-xl">
                            ${member.name.charAt(0)}
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-lg flex items-center gap-2">
                                ${member.name} ${verifiedBadge}
                            </h3>
                            <p class="text-gray-300">@${member.username}</p>
                            <p class="text-sm text-gray-400">${member.followers.toLocaleString()} followers</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between mb-4">
                        <span class="px-3 py-1 rounded-full text-xs font-semibold ${roleClass} text-white">
                            ${getRoleIcon(member.role)} ${member.role.toUpperCase()}
                        </span>
                        <span class="text-xs ${member.source === 'twitter' ? 'text-blue-400' : 'text-amber-400'}">
                            ${sourceBadge}
                        </span>
                    </div>

                    <button
                        onclick="addToMansion(${JSON.stringify(member).replace(/"/g, '&quot;')})"
                        ${isInMansion ? 'disabled' : ''}
                        class="w-full py-3 px-4 ${isInMansion ? 'bg-gray-600 cursor-not-allowed' : 'bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500'} rounded-lg font-semibold transition-all duration-300 transform hover:scale-105 disabled:transform-none"
                    >
                        ${isInMansion ? '✓ In Mansion' : '+ Invite to Mansion'}
                    </button>
                </div>
            `;
        }

        // Create mansion card
        function createMansionCard(resident) {
            const roleClass = `role-${resident.role}`;

            return `
                <div class="card glass p-6 rounded-xl bg-gradient-to-br from-purple-900/30 to-pink-900/30">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-16 h-16 rounded-full ${roleClass} flex items-center justify-center text-white font-bold text-xl">
                            ${resident.name.charAt(0)}
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-lg">${resident.name}</h3>
                            <p class="text-purple-300">📍 ${resident.room.replace('_', ' ').toUpperCase()}</p>
                            <p class="text-sm text-gray-400">Joined: ${new Date(resident.joined_at).toLocaleDateString()}</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between mb-4">
                        <span class="px-3 py-1 rounded-full text-xs font-semibold ${roleClass} text-white">
                            ${getRoleIcon(resident.role)} ${resident.role.toUpperCase()}
                        </span>
                        <span class="text-xs ${resident.source === 'twitter' ? 'text-blue-400' : 'text-amber-400'}">
                            ${resident.source === 'twitter' ? '🐦 Twitter' : '✋ Manual'}
                        </span>
                    </div>

                    <button
                        onclick="removeFromMansion(${resident.id})"
                        class="w-full py-3 px-4 bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-500 hover:to-pink-500 rounded-lg font-semibold transition-all duration-300 transform hover:scale-105"
                    >
                        🗑️ Remove
                    </button>
                </div>
            `;
        }

        // Update counts
        function updateCounts() {
            document.getElementById('memberCount').textContent = members.length;
            document.getElementById('mansionCount').textContent = mansion.length;
        }
    </script>
</body>
</html>
